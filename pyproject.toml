[project]
name = "debate-bro"
version = "0.1.0"
description = "Research-first debate with inspectable evidence and substantive assessment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=2,<3", "httpx>=0.28,<1", "trafilatura>=2,<3",
  "pypdf>=6,<7", "tiktoken>=0.9,<1", "typer>=0.15,<1", "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
debate-bro = "debate_bro.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

